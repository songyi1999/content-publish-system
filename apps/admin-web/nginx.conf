# 管理后台入口（D8-A）：HTTP 80 兼容 + HTTPS 8443（自签 CA）
# 统一入口：静态页面 + /api 反代 + /socket.io 终端心跳网关 + /media 媒体
server {
  listen 80;
  server_name _;
  include /etc/nginx/cps-locations.conf;
}

server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/certs/server.pem;
  ssl_certificate_key /etc/nginx/certs/server.key;
  include /etc/nginx/cps-locations.conf;
}
