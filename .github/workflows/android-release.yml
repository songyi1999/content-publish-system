name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build player web assets
        run: pnpm --filter @cps/player-web run build

      - name: Sync web assets into Android project
        run: pnpm --filter @cps/client-android exec cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 正式签名：密钥库 cps-release.p12 随私有仓库托管，签名配置在 app/build.gradle
      - name: Build release APK
        run: |
          cd apps/client-android/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cps-android-apk
          path: apps/client-android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/client-android/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
