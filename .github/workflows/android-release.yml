name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build player web assets
        run: pnpm --filter @cps/player-web run build

      - name: Sync web assets into Android project
        run: pnpm --filter @cps/client-android exec cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > apps/client-android/android/app/release.keystore

      # 未配置签名 Secrets 时打 debug 签名包（可直接安装体验）；
      # 配置后打正式签名包，签名配置见 docs/CI说明.md 的 build.gradle 片段
      - name: Build release APK
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          cd apps/client-android/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build debug APK
        if: ${{ secrets.ANDROID_KEYSTORE_B64 == '' }}
        run: |
          cd apps/client-android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cps-android-apk
          path: apps/client-android/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/client-android/android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
